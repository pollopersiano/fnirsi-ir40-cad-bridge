name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Create Flutter Project Skeleton
        run: |
          cd ..
          flutter create --org com.example fnirsi_cad_bridge_tmp
          cp -r fnirsi-ir40-cad-bridge/lib fnirsi_cad_bridge_tmp/
          cp fnirsi-ir40-cad-bridge/pubspec.yaml fnirsi_cad_bridge_tmp/
          cp fnirsi-ir40-cad-bridge/android/app/src/main/AndroidManifest.xml fnirsi_cad_bridge_tmp/android/app/src/main/
          cd fnirsi_cad_bridge_tmp
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../fnirsi-ir40-cad-bridge/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnirsi-ir40-bridge-apk
          path: app-release.apk
