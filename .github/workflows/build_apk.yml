name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          mkdir -p app/src/main/java/com/example/fnirsi
          mkdir -p app/src/main/res/layout
          
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.fnirsi'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.fnirsi"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          cp android/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp lib/MainActivity.kt app/src/main/java/com/example/fnirsi/MainActivity.kt
          cp lib/activity_main.xml app/src/main/res/layout/activity_main.xml

          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fnirsi-ir40-bridge-apk
          path: app/build/outputs/apk/release/app-release.apk
