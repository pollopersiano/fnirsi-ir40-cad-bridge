name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/fnirsi
          mkdir -p app/src/main/res/layout

          # Configura gradle.properties per abilitare AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          # Configura settings.gradle
          echo "include ':app'" > settings.gradle

          # Configura build.gradle radice
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Configura app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.fnirsi'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.fnirsi"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Copia risorse e sorgenti
          cp android/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp lib/MainActivity.kt app/src/main/java/com/example/fnirsi/MainActivity.kt
          cp lib/activity_main.xml app/src/main/res/layout/activity_main.xml

      - name: Setup Gradle Wrapper (v8.5)
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnirsi-ir40-bridge-apk
          path: app/build/outputs/apk/release/app-release.apk
