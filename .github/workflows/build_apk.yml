name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/fnirsi
          mkdir -p app/src/main/res/layout
          
          echo "include ':app'" > settings.gradle

          echo "buildscript { repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.1' } }" > build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build.gradle

          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.example.fnirsi'; compileSdk 34; defaultConfig { applicationId 'com.example.fnirsi'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }; buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } } }" >> app/build.gradle

          cp android/app/src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp lib/MainActivity.kt app/src/main/java/com/example/fnirsi/MainActivity.kt
          cp lib/activity_main.xml app/src/main/res/layout/activity_main.xml

      - name: Build APK with Gradle
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnirsi-ir40-bridge-apk
          path: app/build/outputs/apk/release/app-release.apk
