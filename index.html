<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNIRSI IR40 Bridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 20px; color: #888; }
    .value {
      font-size: 2.8rem;
      font-weight: bold;
      color: #00e676;
      margin: 20px 0;
      word-break: break-all;
    }
    .status {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 20px;
    }
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:disabled { background-color: #444; color: #888; }
    .log {
      margin-top: 15px;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>FNIRSI IR40 CAD Bridge</h1>
    <div id="status" class="status">Stato: Disconnesso</div>
    <div id="distance" class="value">--- m</div>
    <button id="connectBtn">Connetti Laser</button>
    <div id="log" class="log">Premi "Connetti" per iniziare</div>
  </div>

  <script>
    const SERVICE_UUID = '0000ee01-0000-1000-8000-00805f9b34fb';
    const TX_CHARACTERISTIC_UUID = '0000ee03-0000-1000-8000-00805f9b34fb';

    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const distanceDiv = document.getElementById('distance');
    const logDiv = document.getElementById('log');

    connectBtn.addEventListener('click', async () => {
      try {
        logDiv.innerText = "Ricerca dispositivi vicini...";
        
        // Modalità permissiva per mostrare tutti i dispositivi BLE
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = "Connessione in corso...";
        logDiv.innerText = `Connessione a ${device.name || 'Dispositivo'}...`;

        const server = await device.gatt.connect();
        
        // Pausa di 600ms per stabilizzare il server GATT su Android
        await new Promise(resolve => setTimeout(resolve, 600));

        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(TX_CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleData);

        statusDiv.innerText = "🟢 Connesso";
        statusDiv.style.color = "#00e676";
        connectBtn.disabled = true;
        logDiv.innerText = "In attesa di misurazioni...";

        device.addEventListener('gattserverdisconnected', () => {
          statusDiv.innerText = "🔴 Disconnesso";
          statusDiv.style.color = "#ff5252";
          connectBtn.disabled = false;
          logDiv.innerText = "Connessione interrotta";
        });

      } catch (error) {
        console.error(error);
        logDiv.innerText = "Errore: " + error.message;
      }
    });

    function handleData(event) {
      const dataView = event.target.value;
      const bytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);

      // Decodifica del pacchetto (modalità passiva)
      if (bytes.length >= 8) {
        let rawVal = (bytes[4] << 24) | (bytes[5] << 16) | (bytes[6] << 8) | bytes[7];
        rawVal = rawVal >>> 0; 
        
        let distanceMeters = (rawVal / 1000).toFixed(3);
        let formattedValue = `${distanceMeters} m`;

        // Aggiorna interfaccia grafica
        distanceDiv.innerText = formattedValue;
        logDiv.innerText = `Ultima lettura: ${new Date().toLocaleTimeString()}`;

        // 1. Copia negli appunti di Android
        navigator.clipboard.writeText(distanceMeters).then(() => {
          // 2. Feedback tattile (Vibrazione)
          if (navigator.vibrate) {
            navigator.vibrate(120);
          }
        }).catch(err => {
          console.error("Errore clipboard:", err);
        });
      }
    }
  </script>
</body>
</html>
